<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Science Vocabulary Explorer</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>

  <header class="site-header">
    <div class="header-inner">
      <h1 class="site-title"><a href="#/">Science Vocabulary Explorer</a></h1>
      <div class="controls">
        <label class="control">
          <span class="control-label">Unit</span>
          <select id="unit-select" aria-label="Choose a unit"></select>
        </label>
        <label class="control search-control">
          <span class="control-label">Search all words</span>
          <input id="search" type="search" placeholder="Try “magnet” or “force”…" autocomplete="off">
        </label>
      </div>
    </div>
  </header>

  <main id="main" class="main"></main>

  <footer class="site-footer">
    <p>Vocabulary support for OpenSciEd units. Your practice answers are saved only on this device.</p>
  </footer>

  <!-- Vocabulary data: add one <script> line per unit file -->
  <script src="data/unit-8-3-forces-at-a-distance.js"></script>

  <script src="js/app.js"></script>
</body>
</html>
