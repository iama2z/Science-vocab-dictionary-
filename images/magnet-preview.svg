<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-labelledby="title description">
  <title id="title">Bar magnet and magnetic field</title>
  <desc id="description">A red and blue bar magnet labeled north and south, surrounded by curved field lines.</desc>
  <defs>
    <linearGradient id="background" x2="0" y2="1">
      <stop offset="0" stop-color="#f8fbff"/>
      <stop offset="1" stop-color="#e8f1fd"/>
    </linearGradient>
    <linearGradient id="north" x2="0" y2="1">
      <stop stop-color="#ef6a62"/>
      <stop offset="1" stop-color="#bf2e31"/>
    </linearGradient>
    <linearGradient id="south" x2="0" y2="1">
      <stop stop-color="#5794d1"/>
      <stop offset="1" stop-color="#245b9b"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-30%" width="140%" height="170%">
      <feDropShadow dx="0" dy="7" stdDeviation="7" flood-color="#263b54" flood-opacity=".22"/>
    </filter>
  </defs>
  <rect width="640" height="360" rx="24" fill="url(#background)"/>
  <g fill="none" stroke="#7193b8" stroke-width="3" opacity=".7">
    <path d="M142 185C160 42 478 42 498 185"/>
    <path d="M164 185C184 78 454 78 476 185"/>
    <path d="M142 185C160 318 478 318 498 185"/>
    <path d="M164 185C184 282 454 282 476 185"/>
  </g>
  <g filter="url(#shadow)" transform="rotate(-8 320 180)">
    <rect x="176" y="139" width="144" height="82" rx="12" fill="url(#north)"/>
    <path d="M320 139h132a12 12 0 0 1 12 12v58a12 12 0 0 1-12 12H320z" fill="url(#south)"/>
    <path d="M320 139v82" stroke="#fff" stroke-opacity=".7" stroke-width="3"/>
    <text x="248" y="191" fill="#fff" font-family="system-ui, sans-serif" font-size="32" font-weight="700" text-anchor="middle">N</text>
    <text x="386" y="191" fill="#fff" font-family="system-ui, sans-serif" font-size="32" font-weight="700" text-anchor="middle">S</text>
  </g>
  <text x="320" y="326" fill="#334b65" font-family="system-ui, sans-serif" font-size="19" text-anchor="middle">A bar magnet has a north pole and a south pole</text>
</svg>
